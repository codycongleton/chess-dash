name: Refresh games.json

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch: {}     # manual trigger

permissions:
  contents: write

concurrency:
  group: refresh-games
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest games
        run: python scripts/fetch_games.py

      - name: Commit refresh
        run: |
          git config user.name  "chess-dash bot"
          git config user.email "actions@github.com"
          git add data/games.json data/ratings.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            if git diff --cached --quiet -- data/games.json; then
              msg="data: refresh ratings.json"
            else
              msg="data: refresh games.json"
            fi
            git commit -m "$msg"
            git push
          fi
